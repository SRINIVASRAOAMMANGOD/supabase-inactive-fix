
name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    if: vars.ENABLE_GITHUB_ACTIONS == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnose Supabase DNS
        run: |
          python - <<'PY'
          import json
          import socket
          from urllib.parse import urlparse

          with open("config.json") as f:
              configs = json.load(f)

          for config in configs:
              host = urlparse(config["supabase_url"]).hostname
              print(f"Testing hostname: {host}")
              try:
                  socket.getaddrinfo(host, 443)
                  print("DNS SUCCESS")
              except Exception as e:
                  print(f"DNS FAILED: {e}")
                  raise
          PY

      - name: Run keep-alive script
        run: python main.py
        env:
          SUPABASE_KEY_1: ${{ secrets.SUPABASE_KEY_1 }}
          SUPABASE_KEY_2: ${{ secrets.SUPABASE_KEY_2 }}
          SUPABASE_KEY_3: ${{ secrets.SUPABASE_KEY_3 }}
          SUPABASE_KEY_4: ${{ secrets.SUPABASE_KEY_4 }}
          SUPABASE_KEY_5: ${{ secrets.SUPABASE_KEY_5 }}
